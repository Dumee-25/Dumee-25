name: Snake

# Redraws the contribution snake in the README once a day, and publishes it to
# the `output` branch, which the README reads from.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7fb6ff&color_dots=#15151d,#173a31,#1f6b56,#3fa382,#8fe3c2

      # The SVG comes out transparent; give it the same near-black card and
      # green glow as the other blocks in the README.
      - name: Add the card background
        run: |
          python3 - <<'EOF'
          import re
          from pathlib import Path

          path = Path("dist/snake.svg")
          svg = path.read_text(encoding="utf-8")
          x, y, w, h = (float(v) for v in re.search(
              r'viewBox="([-\d.]+) ([-\d.]+) ([\d.]+) ([\d.]+)"', svg).groups())
          card = (
              '<defs><radialGradient id="aurora">'
              '<stop offset="0" stop-color="#27c485" stop-opacity=".2"/>'
              '<stop offset="1" stop-color="#27c485" stop-opacity="0"/>'
              '</radialGradient></defs>'
              f'<rect x="{x:g}" y="{y:g}" width="{w:g}" height="{h:g}" rx="22" fill="#06060a"/>'
              f'<ellipse cx="{x + w * 0.2:.1f}" cy="{y + h * 0.35:.1f}" rx="{w * 0.35:.1f}" '
              f'ry="{h:g}" fill="url(#aurora)"/>'
          )
          svg = re.sub(r"(<svg[^>]*>)", lambda m: m.group(1) + card, svg, count=1)
          path.write_text(svg, encoding="utf-8")
          EOF

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
